services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sar-server-pipeline
    environment:
      EDL_USER: ${EDL_USER:-}
      EDL_PASS: ${EDL_PASS:-}
      SNAP_GPT: ${SNAP_GPT:-/opt/snap/bin/gpt}
    volumes:
      - type: bind
        source: ${DATA_ROOT}
        target: /data
      - type: bind
        source: ${JOB_DIR}
        target: /job
      - type: bind
        source: ${SNAP_HOST_DIR}
        target: /opt/snap
        read_only: true
    command:
      - run_all
      - --manifest
      - ${JOB_MANIFEST:-/job/job.yaml}
