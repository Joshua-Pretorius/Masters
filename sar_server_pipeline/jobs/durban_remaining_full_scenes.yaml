schema_version: 1
run_id: durban-remaining-full-scenes-v1
dataset_mode: sa

# Six unique Durban acquisitions remain after the successful
# MERIA_SA_001:after test. MERIA_SA_002:before is intentionally omitted
# because it references that same 2019-04-25 Sentinel-1 granule.
targets:
  - MERIA_SA_001:before
  - MERIA_SA_002:after
  - MERIA_SA_003:before
  - MERIA_SA_003:after
  - MERIA_SA_004:before
  - MERIA_SA_004:after

inputs:
  match_csv: /data/raw/MERIA_SA_plastic_nearest_S1_SLC_before_after.csv
  points_csv: /data/raw/MERIA_SA_plastic_points.csv
  raw_slc_root: /data/raw/slc
  shapefiles_root: /data/shapefiles

outputs:
  processed_root: /data/processed
  patches_root: /data/patches
  stacks_root: /data/stacks
  logs_root: /data/logs
  manifests_root: /data/manifests

stages:
  slc_process:
    enabled: true
    overwrite: false
    gpt: /usr/local/snap/bin/gpt
  patch_extract:
    enabled: false
    overwrite: false
  patch_stack:
    enabled: false
    overwrite: false

processing:
  resolution_policy: snap-native
  output_mode: scene
  subset_mode: full-swath
  subswaths: [IW1, IW2, IW3]
  workers: 1
  cache_gb: 32
  patch_size: 256
