schema_version: 1
run_id: global-all-unique-full-scenes-v1
dataset_mode: global

# All 11 unique processable acquisitions in the current international match
# table. Repeated before/after references to the same Sentinel-1 granule are
# represented once. Observation 05e7c3bc-2eac-4c4b-ba8a-6bf8aa4c0789 is
# omitted because neither role met its 0.75 coverage threshold.
targets:
  # Palma de Mallorca
  - cabcd011-9d82-4124-9f9c-120bdc406cf3:before
  - cabcd011-9d82-4124-9f9c-120bdc406cf3:after

  # Bay Islands of Honduras
  - 9e17ce98-9eeb-40f6-989e-894dc2be72ea:before
  - 9e17ce98-9eeb-40f6-989e-894dc2be72ea:after
  - 33a32832-fc41-4fdd-8c91-a41844fc1709:after

  # Ghana
  - 57bbff03-21eb-54de-9d18-d8a65b256bd5:before
  - 57bbff03-21eb-54de-9d18-d8a65b256bd5:after
  - cd77705c-782d-5b99-935f-405bfd905cbf:before
  - cd77705c-782d-5b99-935f-405bfd905cbf:after
  - d918b4e9-16ac-5c30-830f-6945943e1d9e:after
  - 91ea9edc-67b4-4211-8532-35deec4a3148:after

inputs:
  match_csv: /data/raw/MERIA_global_plastic_nearest_S1_SLC_before_after.csv
  points_csv: /data/raw/MERIA_global_plastic_points.csv
  raw_slc_root: /data/raw/slc
  shapefiles_root: /data/shapefiles

outputs:
  processed_root: /data/processed
  patches_root: /data/patches
  stacks_root: /data/stacks
  logs_root: /data/logs
  manifests_root: /data/manifests

stages:
  slc_process:
    enabled: true
    overwrite: false
    gpt: /usr/local/snap/bin/gpt
  patch_extract:
    enabled: false
    overwrite: false
  patch_stack:
    enabled: false
    overwrite: false

processing:
  resolution_policy: snap-native
  output_mode: scene
  subset_mode: full-swath
  subswaths: [IW1, IW2, IW3]
  workers: 1
  cache_gb: 32
  patch_size: 256
