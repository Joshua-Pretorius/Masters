schema_version: 1
run_id: sa-remaining-east-london-gqeberha-2024-full-scenes-v1
dataset_mode: sa

# Final five unique acquisitions in the current SA match table.
# MERIA_SA_006:after and both MERIA_SA_007 targets are omitted because
# their granules are already represented by MERIA_SA_005:after and
# MERIA_SA_006:before.
targets:
  - MERIA_SA_006:before
  - MERIA_SA_005:before
  - MERIA_SA_005:after
  - MERIA_SA_008:before
  - MERIA_SA_008:after

inputs:
  match_csv: /data/raw/MERIA_SA_plastic_nearest_S1_SLC_before_after.csv
  points_csv: /data/raw/MERIA_SA_plastic_points.csv
  raw_slc_root: /data/raw/slc
  shapefiles_root: /data/shapefiles

outputs:
  processed_root: /data/processed
  patches_root: /data/patches
  stacks_root: /data/stacks
  logs_root: /data/logs
  manifests_root: /data/manifests

stages:
  slc_process:
    enabled: true
    overwrite: false
    gpt: /usr/local/snap/bin/gpt
  patch_extract:
    enabled: false
    overwrite: false
  patch_stack:
    enabled: false
    overwrite: false

processing:
  resolution_policy: snap-native
  output_mode: scene
  subset_mode: full-swath
  subswaths: [IW1, IW2, IW3]
  workers: 1
  cache_gb: 32
  patch_size: 256
